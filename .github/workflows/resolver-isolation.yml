# resolver-isolation -- the regression test for the dependency SEARCH.
#
# Every other job sets C900_TOOLCHAIN explicitly, as it must: a job that
# depended on directory adjacency breaks the first time a runner image moves
# its checkouts.  That leaves the search lists in tools/deps.sh untested, and
# the bug this repository has actually had is a resolver that walked outward,
# found something belonging to somebody else, and reported a false success.
#
# So: the repository ALONE, in a deliberately deep directory, with an empty
# $HOME and a $PATH holding no toolchain -- and the assertion is that the build
# REFUSES, by name.  A pass here means the walk is still bounded and the
# refusal still says which variable to set.
name: resolver-isolation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }

      # Six levels deep, and nothing but this repository anywhere in them.
      # Deeper than the three parents the search is bounded at, so a walk that
      # went further would leave the sandbox and find the runner's own
      # checkouts -- which is the failure being tested for.
      - name: Stage a lone clone, six levels deep
        run: |
          mkdir -p iso/home iso/a/b/c/d/e/f
          rsync -a --exclude .git src/ iso/a/b/c/d/e/f/commodore-900-kboot/

      - name: The resolver refuses, and names C900_TOOLCHAIN
        working-directory: iso/a/b/c/d/e/f/commodore-900-kboot
        run: |
          set +e
          out=$(env -i HOME="$GITHUB_WORKSPACE/iso/home" PATH=/usr/bin:/bin \
                sh tools/toolchain.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          test $rc -ne 0 || { echo "FAIL: resolved a toolchain that is not there"; exit 1; }
          echo "$out" | grep -q C900_TOOLCHAIN || { echo "FAIL: refusal does not name the variable"; exit 1; }

      - name: "`make' refuses too, rather than building against a guess"
        working-directory: iso/a/b/c/d/e/f/commodore-900-kboot
        run: |
          set +e
          out=$(env -i HOME="$GITHUB_WORKSPACE/iso/home" PATH=/usr/bin:/bin \
                make 2>&1)
          rc=$?
          set -e
          echo "$out"
          test $rc -ne 0 || { echo "FAIL: make succeeded with no toolchain"; exit 1; }
          echo "$out" | grep -q C900_TOOLCHAIN || { echo "FAIL: refusal does not name the variable"; exit 1; }

      # `make deps' is the answer the refusal points at, so it must run in the
      # same emptiness -- and, run twice, change nothing the second time.
      - name: make deps places the clone, and is idempotent
        working-directory: iso/a/b/c/d/e/f/commodore-900-kboot
        env:
          HOME_ISO: ${{ github.workspace }}/iso/home
        run: |
          env -i HOME="$HOME_ISO" PATH=/usr/bin:/bin \
              GIT_TERMINAL_PROMPT=0 make deps
          test -d ../commodore-900-toolchain || { echo "FAIL: nothing was cloned"; exit 1; }
          before=$(git -C ../commodore-900-toolchain rev-parse HEAD)
          env -i HOME="$HOME_ISO" PATH=/usr/bin:/bin \
              GIT_TERMINAL_PROMPT=0 make deps
          after=$(git -C ../commodore-900-toolchain rev-parse HEAD)
          test "$before" = "$after" || { echo "FAIL: a second make deps moved the checkout"; exit 1; }
