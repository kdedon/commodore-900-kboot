# resolver-isolation -- the regression test for the dependency SEARCH.
#
# Every other job sets C900_TOOLCHAIN and C900_EMU explicitly, as it must: a
# job that depended on directory adjacency breaks the first time a runner image
# moves its checkouts.  That leaves the search lists in tools/deps.sh untested,
# and the bug this repository has actually had is a resolver that walked
# outward, found something belonging to somebody else, and reported a false
# success.
#
# So: the repository ALONE, in a deliberately deep directory, with an empty
# $HOME and a $PATH holding no compiler -- and the assertion is that the build
# EXITS NON-ZERO.  What the refusal's own text says is not asserted: a message
# a human reworded would fail this job for a reason that has nothing to do with
# the search it exists to test.  A pass here means the walk is still bounded.
name: resolver-isolation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: src }

      # Six levels deep, and nothing but this repository anywhere in them.
      # Deeper than the three parents the search is bounded at, so a walk that
      # went further would leave the sandbox and find the runner's own
      # checkouts -- which is the failure being tested for.
      - name: Stage a lone clone, six levels deep
        run: |
          mkdir -p iso/home iso/a/b/c/d/e/f
          rsync -a --exclude .git src/ iso/a/b/c/d/e/f/commodore-900-kboot/

      - name: The resolver refuses
        working-directory: iso/a/b/c/d/e/f/commodore-900-kboot
        run: |
          set +e
          out=$(env -i HOME="$GITHUB_WORKSPACE/iso/home" PATH=/usr/bin:/bin \
                sh tools/toolchain.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          test $rc -ne 0 || { echo "FAIL: resolved a toolchain that is not there"; exit 1; }

      # The build wants the toolchain, and the assertion is only ever that a
      # build with none present REFUSES.  What the refusal's own text says is
      # not asserted here -- that ties the test to wording rather than to
      # behaviour.
      - name: "`make' refuses too, rather than building against a guess"
        working-directory: iso/a/b/c/d/e/f/commodore-900-kboot
        run: |
          set +e
          out=$(env -i HOME="$GITHUB_WORKSPACE/iso/home" PATH=/usr/bin:/bin \
                make 2>&1)
          rc=$?
          set -e
          echo "$out"
          test $rc -ne 0 || { echo "FAIL: make succeeded with no compiler"; exit 1; }

      # `make deps' is the answer the refusal points at, so it must run in the
      # same emptiness.  The compiler either arrives or is refused BY NAME --
      # not "it fails", which would start failing the day a release moves.
      # What must never happen is exit 0 having placed nothing, which reads
      # downstream as a compiler that is simply missing.
      - name: make deps DEP=toolchain places the compiler, or says why not
        working-directory: iso/a/b/c/d/e/f/commodore-900-kboot
        run: |
          set +e
          out=$(env -i HOME="$GITHUB_WORKSPACE/iso/home" PATH=/usr/bin:/bin \
                make deps DEP=toolchain 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -eq 0 ]; then
            test -x deps/commodore-900-toolchain/host/build/z8001/cc0-z8001 ||
              { echo "FAIL: exit 0 and no compiler placed"; exit 1; }
          fi
