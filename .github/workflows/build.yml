# build -- the loader links, with the compiler the machine itself runs.
#
# This is a FREESTANDING consumer: it has no crts0.s and no kernel behind it,
# so every external symbol the compiler names is one src/crt.s has to define
# (SS, the stack segment a frame reference relocates against).  A compiler
# change that adds one is invisible here until somebody builds -- and once was,
# for days.
#
# It links, and it checks the size ceilings the loader has to fit; it boots
# nothing.  Booting needs an image and an OS, neither of which this repository
# has, and neither of which is needed to see an unresolved symbol.
#
# WHAT THIS DOES AND DOES NOT PROVE.  The compiler here is a BINARY -- the
# Z8001 cross passes out of the toolchain release DEPS names -- so a green run
# says the loader builds with the published compiler and fits its budgets.  It
# does NOT check that compiler's own sources: that gate lives in
# commodore-900-toolchain, on the build the release was cut from.  The
# source-level check in the other direction is the toolchain's own consumer
# link, which builds this loader on every push there.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The compiler and the runner, both pinned in DEPS and both placed where
      # the resolver looks.  No toolchain checkout and no compiler build: this
      # job compiles Z8001 code with Z8001 binaries.  Each edge is placed by
      # name, so a missing release fails the run saying which one -- a step
      # that could not run must never pass quietly.
      - name: The compiler
        run: make deps DEP=toolchain
      - name: The emulator
        run: make deps DEP=emu

      # Which compiler this run used, in the log, before anything is built.
      - name: What is in it
        run: cat deps/commodore-900-toolchain/.provenance

      # Set, never searched: a job that depended on directory adjacency breaks
      # the first time a runner image moves its checkouts.  The search has its
      # own test in resolver-isolation.yml.
      - name: Link the loader
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/deps/commodore-900-toolchain
          C900_EMU: ${{ github.workspace }}/deps/commodore-900-emulator/bin/c900
        run: make

      - name: The host tests
        run: make test

      - name: The link map, when it does not
        if: failure()
        run: cat build/build.log build/obj/link.txt 2>/dev/null || true
